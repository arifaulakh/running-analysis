# Hal Higdon Intermediate 5K — TCS Toronto Waterfront 5K
# 8 Higdon weeks (plan weeks 1-8 == Higdon weeks 1-8). Week 1 Mon =
# 2026-08-17, race Sat 2026-10-17. A TRAVEL BREAK (Aug 24-30) is inserted
# between Week 1 and Week 2 — Arif is travelling that week — so Week 2
# resumes Aug 31 and Week 8 still lands exactly on race week (Oct 12-18).
#
# Higdon's Intermediate 5K puts the race on the SUNDAY of Week 8. TCS
# Toronto is a SATURDAY (Oct 17), so Week 8 is anchored to place the race
# on Sat Oct 17 (Week 8, day 6); Sun Oct 18 is season-done (optional easy
# shakeout only).
#
# Aug 11-16 (before Week 1) is post-HM re-entry: easy aerobic base rebuild
# after the Jul 26 SF Half. No structured quality yet — see `re_entry` below.
#
# Distances are km (per proc_006). Source plan is Higdon mileage,
# converted at 1 mi = 1.609344 km, rounded to 1 decimal:
#   2 mi = 3.2 km | 3 mi = 4.8 km | 4 mi = 6.4 km
#   5 mi = 8.0 km | 6 mi = 9.7 km | 7 mi = 11.3 km
#
# Higdon's Intermediate 5K prescribes NO cross-training days (Mon/Fri are
# Rest). Arif reliably lifts and often runs on rest days (semantic memory):
# Mon and Fri are his natural strength slots. The plan below is the running
# prescription; lifts are logged separately and don't count as missed runs.
#
# Source: https://www.halhigdon.com/training-programs/5k-training/intermediate-5k/

race_date: 2026-10-17
race_name: TCS Toronto Waterfront 5K
race_distance: "5K"
plan: hal-higdon-intermediate-5k
plan_weeks: 8

# Quality-session pace guidance (provisional until the Wk4 5K test):
#   400m repeats — at ~5K goal pace or a touch faster: ~1:34-1:38 per rep
#     (≈3:55-4:05/km), with a 200-400m recovery jog between.
#   Tempo runs   — build to ~threshold in the middle third: ~4:25-4:35/km,
#     HR ~168-174; start and finish easy.
#   "fast" runs  — comfortably hard, faster than easy but not tempo:
#     ~4:45-5:00/km, HR ~155-165.
#   easy runs    — >5:20/km, HR <150.

# Phase mapping — by plan week (1-8)
phases:
  base:       [1, 2]   # re-introduce speed, rebuild after the HM block
  build:      [3, 4]   # speed + tempo mature; Wk4 5K test calibrates goal
  peak:       [6, 7]   # sharpest work — 8x400, 5 mi fast
  sharpen:    [5]      # 7x400 + 6 mi; bridges build→peak
  race_week:  [8]      # taper; race Sat Oct 17

# Pre-plan re-entry (not a Higdon week; for coach context only)
re_entry:
  window: "2026-08-11 to 2026-08-16"
  emphasis: >
    Post-HM recovery + easy aerobic base. Rebuild to ~30-40 km/wk of easy
    running. No structured intervals or tempo yet — one optional strides
    session (4-6 x 20s) late in this window is fine to wake the legs up.
    Actual runs so far: Jul 31 5.0km, Aug 2 7.0km, Aug 4 6.0km, Aug 10 11.0km.

weeks:

  - week: 1
    start_date: 2026-08-24
    end_date:   2026-08-30
    phase: base
    days:
      monday:    {date: 2026-08-24, type: rest,     notes: "Rest (natural lift slot)"}
      tuesday:   {date: 2026-08-25, type: easy,     distance_km: 4.8,  notes: "4.8 km easy"}
      wednesday: {date: 2026-08-26, type: interval, intervals: "5 x 400m at ~5K pace (~1:34-1:38), 200-400m jog recovery", notes: "First speed session of the block — ease in, don't overcook the early reps"}
      thursday:  {date: 2026-08-27, type: easy,     distance_km: 4.8,  notes: "4.8 km easy"}
      friday:    {date: 2026-08-28, type: rest,     notes: "Rest (natural lift slot)"}
      saturday:  {date: 2026-08-29, type: easy,     distance_km: 4.8,  notes: "4.8 km easy"}
      sunday:    {date: 2026-08-30, type: long,     distance_km: 8.0,  notes: "8.0 km long, easy"}

  - week: 2
    start_date: 2026-08-31
    end_date:   2026-09-06
    phase: base
    days:
      monday:    {date: 2026-08-31, type: rest,     notes: "Rest (natural lift slot)"}
      tuesday:   {date: 2026-09-01, type: easy,     distance_km: 4.8}
      wednesday: {date: 2026-09-02, type: tempo,    duration_min: 30, notes: "30 min tempo — build to ~threshold (4:25-4:35/km) in the middle, easy start/finish"}
      thursday:  {date: 2026-09-03, type: easy,     distance_km: 4.8}
      friday:    {date: 2026-09-04, type: rest,     notes: "Rest (natural lift slot)"}
      saturday:  {date: 2026-09-05, type: pace,     distance_km: 4.8, notes: "4.8 km fast — comfortably hard, ~4:45-5:00/km"}
      sunday:    {date: 2026-09-06, type: long,     distance_km: 8.0, notes: "8.0 km long, easy"}

  - week: 3
    start_date: 2026-09-07
    end_date:   2026-09-13
    phase: build
    days:
      monday:    {date: 2026-09-07, type: rest,     notes: "Rest (natural lift slot)"}
      tuesday:   {date: 2026-09-08, type: easy,     distance_km: 4.8}
      wednesday: {date: 2026-09-09, type: interval, intervals: "6 x 400m at ~5K pace (~1:34-1:38), 200-400m jog recovery"}
      thursday:  {date: 2026-09-10, type: easy,     distance_km: 4.8}
      friday:    {date: 2026-09-11, type: rest,     notes: "Rest (natural lift slot)"}
      saturday:  {date: 2026-09-12, type: easy,     distance_km: 6.4, notes: "6.4 km easy"}
      sunday:    {date: 2026-09-13, type: long,     distance_km: 9.7, notes: "9.7 km long, easy"}

  - week: 4
    start_date: 2026-09-14
    end_date:   2026-09-20
    phase: build
    days:
      monday:    {date: 2026-09-14, type: rest,     notes: "Rest (natural lift slot)"}
      tuesday:   {date: 2026-09-15, type: easy,     distance_km: 4.8}
      wednesday: {date: 2026-09-16, type: tempo,    duration_min: 35, notes: "35 min tempo — build to ~threshold in the middle"}
      thursday:  {date: 2026-09-17, type: easy,     distance_km: 4.8}
      friday:    {date: 2026-09-18, type: rest,     notes: "Rest — race-test prep"}
      saturday:  {date: 2026-09-19, type: rest,     notes: "Rest — day before the 5K test"}
      sunday:    {date: 2026-09-20, type: race,     race_distance: "5K", notes: "★ 5K TEST — race-effort time trial to calibrate goal pace. Run it honestly; this recalibrates the goal band in profile.json."}

  - week: 5
    start_date: 2026-09-21
    end_date:   2026-09-27
    phase: sharpen
    days:
      monday:    {date: 2026-09-21, type: rest,     notes: "Rest (natural lift slot); easy recovery from the 5K test if legs are heavy"}
      tuesday:   {date: 2026-09-22, type: easy,     distance_km: 4.8}
      wednesday: {date: 2026-09-23, type: interval, intervals: "7 x 400m at ~5K pace (~1:34-1:38), 200-400m jog recovery"}
      thursday:  {date: 2026-09-24, type: easy,     distance_km: 4.8}
      friday:    {date: 2026-09-25, type: rest,     notes: "Rest (natural lift slot)"}
      saturday:  {date: 2026-09-26, type: pace,     distance_km: 6.4, notes: "6.4 km fast — comfortably hard, ~4:45-5:00/km"}
      sunday:    {date: 2026-09-27, type: long,     distance_km: 9.7, notes: "9.7 km long, easy"}

  - week: 6
    start_date: 2026-09-28
    end_date:   2026-10-04
    phase: peak
    days:
      monday:    {date: 2026-09-28, type: rest,     notes: "Rest (natural lift slot)"}
      tuesday:   {date: 2026-09-29, type: easy,     distance_km: 4.8}
      wednesday: {date: 2026-09-30, type: tempo,    duration_min: 40, notes: "40 min tempo — longest tempo of the block; build to ~threshold in the middle"}
      thursday:  {date: 2026-10-01, type: easy,     distance_km: 4.8}
      friday:    {date: 2026-10-02, type: rest,     notes: "Rest (natural lift slot)"}
      saturday:  {date: 2026-10-03, type: easy,     distance_km: 8.0, notes: "8.0 km easy"}
      sunday:    {date: 2026-10-04, type: long,     distance_km: 11.3, notes: "11.3 km long — longest run of the block, easy"}

  - week: 7
    start_date: 2026-10-05
    end_date:   2026-10-11
    phase: peak
    days:
      monday:    {date: 2026-10-05, type: rest,     notes: "Rest (natural lift slot)"}
      tuesday:   {date: 2026-10-06, type: easy,     distance_km: 4.8}
      wednesday: {date: 2026-10-07, type: interval, intervals: "8 x 400m at ~5K pace (~1:34-1:38), 200-400m jog recovery", notes: "Sharpest VO2 session of the block"}
      thursday:  {date: 2026-10-08, type: easy,     distance_km: 4.8}
      friday:    {date: 2026-10-09, type: rest,     notes: "Rest (natural lift slot)"}
      saturday:  {date: 2026-10-10, type: pace,     distance_km: 8.0, notes: "8.0 km fast — comfortably hard, ~4:45-5:00/km. Last hard effort before taper."}
      sunday:    {date: 2026-10-11, type: long,     distance_km: 11.3, notes: "11.3 km long, easy"}

  - week: 8
    start_date: 2026-10-12
    end_date:   2026-10-18
    phase: race_week
    notes: "Taper. Race is SATURDAY Oct 17 (Higdon's Sunday race moved to Sat to match TCS Toronto). Sun Oct 18 = season done, optional very-easy shakeout only."
    days:
      monday:    {date: 2026-10-12, type: rest,     notes: "Rest"}
      tuesday:   {date: 2026-10-13, type: easy,     distance_km: 4.8, notes: "4.8 km easy"}
      wednesday: {date: 2026-10-14, type: tempo,    duration_min: 30, notes: "30 min tempo but CONTROLLED — sharpening, not a workout. 3 days out."}
      thursday:  {date: 2026-10-15, type: easy,     distance_km: 3.2, notes: "3.2 km easy shakeout"}
      friday:    {date: 2026-10-16, type: rest,     notes: "Rest — race day -1. Optional 2-3 km shakeout w/ 2-3 strides if legs feel flat."}
      saturday:  {date: 2026-10-17, type: race,     race_distance: "5K", notes: "★★★ GOAL RACE — TCS Toronto Waterfront 5K. Goal band sub-20:00 stretch / 20:00-20:45 target."}
      sunday:    {date: 2026-10-18, type: rest,     notes: "Season done. Optional very-easy shakeout only."}
